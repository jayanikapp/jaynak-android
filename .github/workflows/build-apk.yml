name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.config/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E '^e: ' build.log | sed 's|file:///[^ ]*/java/com/jaynak/app/||' | head -40 | while read -r l; do echo "::error::${l}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: jaynak-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 1
      - name: Show signing SHA-1
        if: always()
        run: |
          find ~ -name debug.keystore 2>/dev/null | while read k; do echo "== $k"; keytool -list -v -keystore "$k" -storepass android 2>&1 | grep -E 'SHA1|SHA256|rror'; done || true
