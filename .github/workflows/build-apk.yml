name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jaynak-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Show signing SHA-1
        if: always()
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E 'SHA1|SHA256'
